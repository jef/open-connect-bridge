name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test release planner
        shell: bash
        run: rustc --edition 2024 --test scripts/release-plan.rs -o release-plan-test && ./release-plan-test

  package:
    name: Package ${{ matrix.platform }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            assets: open-connect-bridge.exe
          - platform: linux
            os: ubuntu-latest
            assets: open-connect-bridge-dev-linux-x64.tar.gz
          - platform: macos
            os: macos-latest
            assets: open-connect-bridge-dev-mac-x64.dmg open-connect-bridge-dev-mac-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri
      - name: Build assets
        shell: bash
        run: bash scripts/package.sh "${{ matrix.platform }}"
      - name: Verify assets
        shell: bash
        run: |
          for file in ${{ matrix.assets }}; do
            test -s "build/release/$file"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
