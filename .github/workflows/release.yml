name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - run: rustc --edition 2024 --test scripts/release-plan.rs -o release-plan-test && ./release-plan-test

  plan:
    name: Calculate version
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          rustc --edition 2024 scripts/release-plan.rs -o release-plan
          version=$(./release-plan)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri
      - name: Build release artifacts
        shell: bash
        run: bash scripts/package.sh "${{ matrix.platform }}" "${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          rustc --edition 2024 scripts/release-plan.rs -o release-plan
          [ "$(./release-plan)" = "$VERSION" ]
          for file in "open-connect-bridge.exe" "open-connect-bridge-$VERSION-linux-x64.tar.gz" "open-connect-bridge-$VERSION-mac-x64.dmg" "open-connect-bridge-$VERSION-mac-arm64.dmg"; do
            test -s "build/release/$file"
          done
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --title "v$VERSION" --generate-notes build/release/*
          gh release edit "v$VERSION" --draft=false
