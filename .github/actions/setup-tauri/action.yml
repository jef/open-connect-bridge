name: Set up Tauri
description: Installs the Rust toolchain, platform libraries and pinned Tauri CLI, with caching

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Install Rust
      shell: bash
      run: rustup toolchain install stable --profile minimal
    - name: Install macOS Rust targets
      if: runner.os == 'macOS'
      shell: bash
      run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - name: Cache Tauri CLI
      id: tauri-cli
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/tauri-cli
        key: tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}
    - name: Install Tauri CLI
      if: steps.tauri-cli.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install tauri-cli --version 2.12.4 --locked --root "$RUNNER_TEMP/tauri-cli"
    - name: Add Tauri CLI to PATH
      shell: bash
      run: echo "$RUNNER_TEMP/tauri-cli/bin" >> "$GITHUB_PATH"
